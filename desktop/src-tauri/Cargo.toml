[package]
name = "cahangir-desktop"
version = "1.0.0"
description = "Cahangir AI & Connect Desktop Application for Windows"
authors = ["Cahangir AI Team"]
edition = "2021"

[lib]
name = "cahangir_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-clipboard-manager = "2.2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
sha2 = "0.10"
hex = "0.4"
axum = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
